services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_PROVIDER_BASE_URL: https://jsonplaceholder.typicode.com
      APP_MAX_CONCURRENCY: "10"
      APP_REDIS_URL: redis://redis:6379/0
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/users
      APP_CORS_ORIGINS: '["http://localhost:8080"]'
      APP_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
